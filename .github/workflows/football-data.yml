name: Football data

# nflverse refresh for the current season (ADR-028/029/030).
# 13:00 UTC: schedules and results (and event links), team-game stats from the latest
#   play-by-play, snap counts, injury reports, the curated coaching staff (+ drift check), game
#   context, point-in-time weather forecasts, and MarketScope Ratings snapshots (the full filter is
#   replayed from 2012 with frozen parameters; play-by-play is kept in the Actions cache). nflverse rebuilds overnight, so this picks up
#   Sunday, Monday and Thursday games the next morning.
# 23:00 UTC: injury reports only, a second daily snapshot after teams publish their reports
#   (≈ 4 pm ET), so status changes get a tighter first-seen time.
# Every step is idempotent per job key, so a delayed or repeated run is harmless.
on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons, e.g. current, 2026 or 2016-2026"
        default: current

permissions:
  contents: read

concurrency:
  group: football-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEASONS: ${{ inputs.seasons || 'current' }}
    defaults:
      run:
        working-directory: apps/football
    steps:
      # Checkout first: the default working directory (apps/football) must exist.
      - uses: actions/checkout@v7
      - name: Check secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is required."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/football/requirements.txt
      - run: pip install -r requirements.txt
      # Past seasons' play-by-play rarely changes: restore the newest cache, save a fresh one per run
      # (the current season is re-downloaded by team-stats --refresh). First run downloads 2012+.
      - name: Restore play-by-play cache
        if: github.event.schedule != '0 23 * * *'
        uses: actions/cache@v6
        with:
          path: apps/football/.cache/pbp
          key: pbp-v1-${{ github.run_id }}
          restore-keys: pbp-v1-
      - name: Schedules and results
        if: github.event.schedule != '0 23 * * *'
        run: PYTHONPATH=src python -m marketscope_football.ingest schedules --seasons "$SEASONS"
      - name: Team-game stats
        if: github.event.schedule != '0 23 * * *'
        run: PYTHONPATH=src python -m marketscope_football.ingest team-stats --seasons "$SEASONS" --refresh
      - name: Snap counts
        if: github.event.schedule != '0 23 * * *'
        run: PYTHONPATH=src python -m marketscope_football.ingest snaps --seasons "$SEASONS"
      - name: Injury reports
        run: PYTHONPATH=src python -m marketscope_football.ingest injuries --seasons "$SEASONS"
      # Loads data/coaching_staff.csv when it changed (job key = file hash), then flags drift
      # between the CSV and teams' current Wikipedia staff pages as warnings (never fails).
      - name: Coaching staff
        if: github.event.schedule != '0 23 * * *'
        run: PYTHONPATH=src python -m marketscope_football.ingest coaching
      - name: Game context (rest, travel, time zones, coaching tenure)
        if: github.event.schedule != '0 23 * * *'
        run: PYTHONPATH=src python -m marketscope_football.ingest context --seasons "$SEASONS"
      - name: MarketScope Ratings snapshots
        if: github.event.schedule != '0 23 * * *'
        run: PYTHONPATH=src python -m marketscope_football.ingest ratings
      - name: Weather forecasts (Open-Meteo, games from 10 days ago to 8 days ahead)
        if: github.event.schedule != '0 23 * * *'
        run: PYTHONPATH=src python -m marketscope_football.ingest weather --seasons "$SEASONS" --recent
      - name: Coaching staff drift check
        if: github.event.schedule != '0 23 * * *'
        continue-on-error: true
        run: PYTHONPATH=src python -m marketscope_football.coaching_build --check
