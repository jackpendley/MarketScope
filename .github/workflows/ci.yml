name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          # Ephemeral CI container: trust auth means no password exists to leak or flag.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: marketscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/marketscope_test

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # Fails if src/schema.ts changed without a committed migration.
      - name: Check migrations match schema
        run: |
          pnpm --filter @marketscope/db db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run 'pnpm --filter @marketscope/db db:generate' and commit the result."
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: marketscope_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Seeded with SYNTHETIC history by e2e/global-setup.ts (guarded to *e2e* DB names).
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/marketscope_e2e_test

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @marketscope/web exec playwright install --with-deps chromium
      - run: pnpm --filter @marketscope/web build
      - run: pnpm --filter @marketscope/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  football:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: marketscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/marketscope_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The schema is owned by Drizzle; Python never migrates.
      - name: Migrate test database
        run: DATABASE_URL=$TEST_DATABASE_URL pnpm db:migrate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/football/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/football
      - run: python -m pytest -q
        working-directory: apps/football
