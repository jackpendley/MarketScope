name: Paper portfolio

# Hypothetical positions from the pre-registered systems (MS-045b, ADR-056). Nothing is wagered.
# - After every odds collection: place live positions for games kicking off within ~6 hours, from the
#   snapshot just collected (each position at most once; placement is immutable in the database).
# - 11:30 UTC daily, after the line-move import: grade finished games (result, Pinnacle close, CLV).
on:
  workflow_run:
    workflows: ["Collect NFL odds"]
    types: [completed]
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "place, grade or reconstruct"
        default: grade

permissions:
  contents: read

concurrency:
  group: paper-portfolio
  cancel-in-progress: false

jobs:
  paper:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7
      - name: Check secret is configured
        run: |
          if [ -z "$PAPER_DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is required."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r requirements.txt
      - name: Place live positions
        if: github.event_name == 'workflow_run' || inputs.command == 'place'
        run: PYTHONPATH=src python -m marketscope_research.paper place
      - name: Reconstruct finished games
        if: inputs.command == 'reconstruct'
        run: PYTHONPATH=src python -m marketscope_research.paper reconstruct
      - name: Grade
        run: PYTHONPATH=src python -m marketscope_research.paper grade
