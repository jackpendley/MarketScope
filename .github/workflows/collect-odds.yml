name: Collect NFL odds

# 4×/day, one run per 6-hour slot. The collector's job key is derived from the slot
# (COLLECT_SLOT_MINUTES=360), so a delayed or duplicated GitHub cron run still collects
# exactly once per slot, and the budget guard stops it before credits run out.
on:
  schedule:
    - cron: "7 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      COLLECT_SLOT_MINUTES: "360"
    steps:
      - name: Check secrets are configured
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$ODDS_API_KEY" ]; then
            echo "::error::Repository secrets DATABASE_URL and ODDS_API_KEY are required."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @marketscope/collector...

      - name: Collect
        run: pnpm --filter @marketscope/collector collect:nfl --scheduled

      # Recompute versioned signals for games kicking off from 2 days ago to 14 days out.
      # Idempotent; runs even when the slot was already collected so definitions stay current.
      - name: Compute signals
        run: pnpm --filter @marketscope/collector signals:compute
