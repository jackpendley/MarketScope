name: Migrate production database

# Applies committed migrations to the Supabase database when they land on main.
# CI has already applied them to a fresh Postgres 17 by the time this runs.
on:
  push:
    branches: [main]
    paths:
      - "packages/db/drizzle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is required."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @marketscope/db...
      - run: pnpm --filter @marketscope/db db:migrate
